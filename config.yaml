# AirQuote settings -- the shared defaults.
#
# Your own copy lives in ~/.config/praattypen/config.yaml (install.sh creates
# it from this file). AirQuote reads that one when it exists, and the Models
# tab writes to it, so edit that file, not this one. Restart AirQuote after a
# change.

# Key to hold while you speak (double-tap it for hands-free).
# right_option, right_command, right_control, left_option, fn, f13, ...
# Fn is often taken by macOS (emoji, dictation) or other apps; a right-hand
# modifier key is the safer choice.
hotkey: "right_option"

# "nl,en" detects the language of every dictation but only chooses between
# these, falling back to the first. One code ("en") fixes the language;
# "auto" lets Whisper pick any language (unreliable on very short phrases).
language: "nl,en"

engine: "local_whisper"
cloud_boost: false
cleanup:
  enabled: false
  provider: "ollama"
  model: "qwen2.5:3b"
  remove_fillers: true
models:
  # "auto" picks the best model for this Mac (see the Models tab) and
  # downloads it on first use. Or name one: a Hugging Face repo id such as
  # "mlx-community/whisper-large-v3-turbo", or a folder with MLX weights.
  whisper: "auto"
  parakeet: "mlx-community/parakeet-tdt-0.6b-v3"
  groq: "whisper-large-v3-turbo"
paste_method: "clipboard"
sample_rate: 16000

# Recordings shorter than this (seconds), or whose loudest 0.3 s stays below
# this level, are ignored, so Whisper does not hallucinate on silence. True
# digital silence (a denied microphone) is exactly 0.0.
min_speech_seconds: 0.3
min_speech_rms: 0.0015

# At startup, remove unused Whisper/Parakeet downloads once they pass this
# size. Models listed in the Models tab are never removed.
auto_cache_clean: true
max_model_cache_gb: 3.0

# Floating bar while you dictate.
overlay_enabled: true

# Soft sounds on start, stop and paste (volume 0.0 - 1.0).
sounds_enabled: true
sound_volume: 0.25

# Local Ollama model for the "to Dutch", "Feedback" and "Rewrite" modes.
# Optional: without Ollama those modes paste the plain transcript.
assistant_model: "gemma4:12b"

# Menu bar icon (does not appear on macOS 26) and Dock icon.
menu_bar_enabled: true
dock_icon: true

# Safety stop: a recording this long (seconds) is finished automatically.
max_recording_seconds: 900

# The AirQuote window (click the Dock icon).
status_window_enabled: true

# Keep finished dictations in
# ~/Library/Application Support/PraatTypen/history.jsonl for the Recent tab.
# Set to false to keep nothing on disk.
history_enabled: true
history_size: 200
